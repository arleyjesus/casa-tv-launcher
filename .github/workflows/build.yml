name: Build and APK checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Home redirect policy
        shell: pwsh
        run: ./scripts/test-home.ps1
      - name: Test display option bounds
        shell: pwsh
        run: ./scripts/test-display-options.ps1
      - name: Test gallery download limits
        shell: pwsh
        run: ./scripts/test-gallery.ps1
      - name: Test TCL picture action policy
        shell: pwsh
        run: ./scripts/test-picture.ps1
      - name: Test game browser URL policy
        shell: pwsh
        run: ./scripts/test-games.ps1
      - name: Test online ambient limits
        shell: pwsh
        run: ./scripts/test-online.ps1
      - name: Build unsigned APK with installed Android SDK
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check APK privacy and manifest contract
        shell: pwsh
        run: |
          $apk = Get-ChildItem build/*-unsigned.apk | Select-Object -First 1
          ./scripts/verify-apk.ps1 -ApkPath $apk.FullName
